<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Geist:wght@400;600;700;800;900&family=Geist+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
{{THEME_CSS}}
#codecard{top:330px;height:392px;padding:20px 26px;box-sizing:border-box}
#codecard .ctitle{margin-bottom:10px}
#memo{color:var(--ok);opacity:0}
#gridcard{top:735px;height:600px}
#gtitle{position:absolute;left:90px;right:90px;top:760px}
#call{font-size:30px;letter-spacing:0;text-transform:none;color:var(--ink);background:var(--card2);border:2px solid var(--edge);padding:8px 18px;border-radius:14px}
#count{font-size:30px;letter-spacing:.06em;color:var(--dim)}
#count b{display:inline-block;color:var(--hi);font-size:40px;min-width:40px;text-align:center}
svg#g{position:absolute;left:0;top:0;width:1080px;height:1920px}
#robot{position:absolute;width:150px;height:150px;margin:-75px 0 0 -75px}
.num{position:absolute;width:220px;text-align:center;font-family:"Geist Mono",monospace;font-weight:700;font-size:96px;color:var(--hi);text-shadow:0 0 calc(var(--glow)*24px) rgba(255,212,59,.5)}
.num small{display:block;font-size:30px;color:var(--dim);margin-top:-6px;text-shadow:none}
.lbl{position:absolute;font-family:"Geist Mono",monospace;font-weight:700;font-size:28px;padding:6px 14px;border-radius:12px;white-space:nowrap}
#big{position:absolute;left:60px;right:60px;top:735px;height:600px;opacity:0}
#mini{position:absolute;left:50px;top:90px;width:440px;height:440px;display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
#mini i{border-radius:6px;background:rgba(255,255,255,.08);border:1px solid var(--edge)}
#mini i.on{background:var(--ok);border-color:var(--ok);box-shadow:0 0 calc(var(--glow)*12px) var(--ok)}
#bigtxt{position:absolute;left:530px;right:30px;top:150px}
#bigtxt .k{font-family:"Geist Mono",monospace;font-weight:700;font-size:28px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
#bigtxt .n{font-family:"Geist Mono",monospace;font-weight:700;font-size:100px;letter-spacing:-.04em;line-height:1.05;margin-top:10px}
#bigtxt .u{font-weight:800;font-size:44px;margin-top:4px}
#cta{position:absolute;left:60px;right:60px;top:735px;height:600px;opacity:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px}
.btn{font-weight:900;font-size:70px;padding:26px 60px;border-radius:999px;color:#fff;display:flex;align-items:center;gap:20px}
.btn.yt{background:#e5322d;box-shadow:0 0 calc(var(--glow)*50px) rgba(229,50,45,.6)}
.btn.ig{background:#0095f6;box-shadow:0 0 calc(var(--glow)*50px) rgba(0,149,246,.6)}
.site{font-family:"Geist Mono",monospace;font-weight:700;font-size:46px;padding:18px 34px;border-radius:999px;border:3px solid var(--ok);color:var(--ok)}
</style></head><body class="{{THEME}}">
<div id="v"><div id="stage">
 <div class="top"><span class="brand"><span class="mark"><svg width="34" height="34" viewBox="0 0 32 32"><path d="M12 9l-6 7 6 7M20 9l6 7-6 7" stroke="#f6f3ec" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Crack Tech</span><span class="tag">Unique paths · recursion</span></div>
 <div id="prog"></div>
 <div class="card" id="codecard">
  <div class="ctitle"><span>paths.py</span><span id="memo">+ @cache ⚡ saves answers</span></div>
  <div class="code" id="code">
<div><span class="n">1</span><span class="kw">def</span> paths(r, c):</div>
<div><span class="n">2</span>    <span class="kw">if</span> r == ROWS <span class="kw">or</span> c == COLS:</div>
<div><span class="n">3</span>        <span class="kw">return</span> <span class="b">0</span>   <span class="cm"># off the grid</span></div>
<div><span class="n">4</span>    <span class="kw">if</span> (r, c) == GOAL:</div>
<div><span class="n">5</span>        <span class="kw">return</span> <span class="g">1</span>   <span class="cm"># found a path</span></div>
<div><span class="n">6</span>    <span class="kw">return</span> <span class="r">paths(r, c+1)</span> + <span class="d">paths(r+1, c)</span></div>
  </div>
 </div>
 <div class="card" id="gridcard"></div>
 <div class="ctitle" id="gtitle"><span id="call">paths(0, 0)</span><span id="count">paths found <b id="cn">?</b></span></div>
 <svg id="g"></svg>
 <div id="nums"></div>
 <div id="robot"><svg viewBox="0 0 150 150" width="150" height="150">
  <line x1="75" y1="16" x2="75" y2="34" stroke="var(--cy)" stroke-width="6" stroke-linecap="round"/><circle cx="75" cy="13" r="8" fill="var(--hi)"/>
  <rect x="30" y="34" width="90" height="62" rx="20" fill="var(--card2)" stroke="var(--cy)" stroke-width="6"/>
  <circle cx="57" cy="64" r="10" fill="var(--cy)"/><circle cx="93" cy="64" r="10" fill="var(--cy)"/>
  <rect x="44" y="102" width="62" height="34" rx="12" fill="var(--card2)" stroke="var(--cy)" stroke-width="6"/>
  <circle cx="75" cy="119" r="6" fill="var(--ok)"/></svg></div>
 <div id="big"><div id="mini"></div><div id="bigtxt"><div class="k" id="bk">10 × 10 grid</div><div class="n" id="bn">0</div><div class="u" id="bu">paths</div></div></div>
 <div id="cta">{{CTA}}</div>
 <div id="cap"></div>
</div></div>
<script>
{{RUNTIME}}
const R = 2, C = 3, GR = 1, GC = 2, CELL = 220, GX = 210, GY = 835;
const X = c => GX + c * CELL + CELL / 2, Y = r => GY + r * CELL + CELL / 2;
const PCOL = ['var(--hi)', 'var(--pk)', 'var(--cy)'];
let STEPS = [], PATHS = [], T0, T1, FILL = [];
const $ = id => document.getElementById(id);
for (let i = 0; i < 100; i++) $('mini').appendChild(document.createElement('i'));

window.setup = tl => {
  RT.init(tl);
  // Depth-first trace of paths(0, 0): right first, then down; every step becomes an animation step.
  let pos = [0, 0]; const trail = [[0, 0]], steps = [], paths = [];
  const dfs = (r, c) => {
    if (r === GR && c === GC) { paths.push(trail.slice()); steps.push({ kind: 'found', from: pos, to: pos, trail: trail.slice(), w: 1.5, n: paths.length }); return; }
    for (const [dr, dc] of [[0, 1], [1, 0]]) {
      const nr = r + dr, nc = c + dc;
      if (nr >= R || nc >= C) { steps.push({ kind: 'off', from: pos, to: pos, dir: [dr, dc], call: [nr, nc], trail: trail.slice(), w: 1 }); continue; }
      steps.push({ kind: 'move', from: pos, to: [nr, nc], trail: trail.slice(), w: 1 }); trail.push([nr, nc]); pos = [nr, nc];
      dfs(nr, nc);
      trail.pop(); steps.push({ kind: 'back', from: pos, to: [r, c], trail: trail.slice(), w: 0.55 }); pos = [r, c];
    }
  };
  dfs(0, 0);
  T0 = RT.L('trace', 0).start + 1.0; T1 = RT.L('trace', 3).start - 0.1;
  const W = steps.reduce((a, s) => a + s.w, 0); let t = T0;
  for (const s of steps) { s.t0 = t; s.t1 = t + (T1 - T0) * s.w / W; t = s.t1; RT.addSfx(s.t0, s.kind === 'back' ? 'tick2' : s.kind === 'move' ? 'tick' : s.kind); }
  STEPS = steps; PATHS = paths;
  // number fill order for the trick: from the flag backwards
  const k0 = RT.L('trick', 0), order = [[1, 2], [1, 1], [1, 0], [0, 2], [0, 1], [0, 0]];
  const val = (r, c) => (r === R - 1 || c === C - 1) ? 1 : val(r, c + 1) + val(r + 1, c);
  FILL = order.map(([r, c], i) => ({ r, c, v: val(r, c), sum: (r < R - 1 && c < C - 1) ? `${val(r, c + 1)} + ${val(r + 1, c)}` : '', t: k0.start + 1.2 + i * (k0.end - k0.start - 1.3) / order.length }));
  FILL.forEach(f => RT.addSfx(f.t, 'tick'));
  RT.addSfx(RT.L('trick', 1).start + 1.6, 'found');
  for (const s of tl.scenes.slice(1)) RT.addSfx(s.start, 'whoosh');
  RT.addSfx(RT.L('rule', 1).start + 0.3, 'found'); RT.addSfx(RT.L('rule', 2).start + 0.3, 'off');
  window.SFX = RT.sfx;
};

function robotAt(t) {
  if (t < T0 || t >= T1) return { x: X(0), y: Y(0), s: 1, step: null };
  const s = STEPS.find(s => t >= s.t0 && t < s.t1); const p = RT.ease(RT.p(t, s.t0, s.t1));
  let x = X(s.from[1]) + (X(s.to[1]) - X(s.from[1])) * p, y = Y(s.from[0]) + (Y(s.to[0]) - Y(s.from[0])) * p, sc = 1;
  if (s.kind === 'off') { const b = Math.sin(Math.PI * RT.p(t, s.t0, s.t1)) * 0.28 * CELL; x += s.dir[1] * b; y += s.dir[0] * b; }
  if (s.kind === 'found') sc = 1 + 0.15 * Math.sin(Math.PI * RT.p(t, s.t0, s.t0 + 0.35));
  return { x, y, s: sc, step: s };
}
const pts = cells => cells.map(([r, c]) => `${X(c)},${Y(r)}`).join(' ');

window.setT = t => {
  RT.frame(t);
  const l = RT.at(t), sc = l.scene, li = l.li;
  const inBig = sc === 'trick' && li >= 1, inCta = sc === 'cta';
  const rb = robotAt(t), st = rb.step;
  let svg = '';
  // grid
  const gridOp = inBig || inCta ? 0 : 1;
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
    const goal = r === GR && c === GC;
    svg += `<rect x="${X(c) - CELL / 2 + 6}" y="${Y(r) - CELL / 2 + 6}" width="${CELL - 12}" height="${CELL - 12}" rx="22" fill="var(--card2)" stroke="${goal ? 'var(--ok)' : 'var(--edge)'}" stroke-width="${goal ? 4 : 2}" opacity="${gridOp}"/>`;
  }
  if (gridOp) {
    // flag
    const showFlag = sc !== 'trick';
    const fl = sc === 'rule' && li === 1 ? 1 + 0.12 * Math.sin(t * 9) : st && st.kind === 'found' ? 1.2 : 1;
    svg += `<g opacity="${showFlag ? 1 : 0}" transform="translate(${X(GC) + 30},${Y(GR) + 10}) scale(${fl})"><line x1="0" y1="-70" x2="0" y2="70" stroke="var(--ink)" stroke-width="7" stroke-linecap="round"/><path d="M0 -70 L70 -48 L0 -26 Z" fill="var(--ok)"/></g>`;
    svg += `<text x="${X(0)}" y="${Y(0) - 82}" text-anchor="middle" font-family="Geist Mono" font-weight="700" font-size="24" fill="var(--dim)" letter-spacing="3">START</text>`;
    // saved paths (offset so overlapping ones stay visible)
    const tr = sc === 'trick' ? 0.12 : 1;
    PATHS.forEach((p, i) => {
      const fs = STEPS.find(s => s.kind === 'found' && s.n === i + 1);
      if (t >= fs.t0 && (sc === 'trace' || sc === 'trick')) { const o = (i - 1) * 14; svg += `<polyline points="${p.map(([r, c]) => `${X(c) + o},${Y(r) + o}`).join(' ')}" fill="none" stroke="${PCOL[i]}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="${0.75 * tr}"/>`; }
    });
    // live trail
    if (st) svg += `<polyline points="${pts(st.trail)} ${rb.x},${rb.y}" fill="none" stroke="var(--ok)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity=".9" style="filter:drop-shadow(0 0 calc(var(--glow)*10px) var(--ok))"/>`;
    // off-grid marker
    const offShow = (st && st.kind === 'off') ? { r: st.call[0], c: st.call[1], o: Math.sin(Math.PI * RT.p(t, st.t0, st.t1)) } : (sc === 'rule' && li === 2) ? { r: 0, c: 3, o: RT.p(t, l.start + 0.2, l.start + 0.5) } : null;
    if (offShow) {
      const ox = offShow.c >= C ? GX + C * CELL + 52 : X(offShow.c), oy = offShow.r >= R ? GY + R * CELL + 40 : Y(offShow.r);
      svg += `<g opacity="${offShow.o}"><circle cx="${ox}" cy="${oy}" r="38" fill="var(--bad)"/><path d="M${ox - 14} ${oy - 14}L${ox + 14} ${oy + 14}M${ox + 14} ${oy - 14}L${ox - 14} ${oy + 14}" stroke="var(--bg)" stroke-width="8" stroke-linecap="round"/></g>`;
    }
    // move arrows (hook line 1 and rule line 0)
    if ((sc === 'hook' && li === 1) || (sc === 'rule' && li === 0)) {
      const a = RT.ease(RT.p(t, l.start + 0.1, l.start + 0.5));
      svg += `<g opacity="${a}"><path d="M${X(0) + 80} ${Y(0)} L${X(0) + 80 + 70 * a} ${Y(0)}" stroke="var(--cy)" stroke-width="12" stroke-linecap="round"/><path d="M${X(0) + 160 * a + 10} ${Y(0) - 22} l26 22 l-26 22" fill="none" stroke="var(--cy)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M${X(0)} ${Y(0) + 80} L${X(0)} ${Y(0) + 80 + 70 * a}" stroke="var(--pk)" stroke-width="12" stroke-linecap="round"/><path d="M${X(0) - 22} ${Y(0) + 160 * a + 10} l22 26 l22 -26" fill="none" stroke="var(--pk)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></g>`;
    }
  }
  $('g').innerHTML = svg;
  // labels on rule line 0: the two recursive calls
  let lab = '';
  if (sc === 'rule' && li === 0) { const a = RT.p(t, l.start + 0.6, l.start + 0.9);
    lab += `<div class="lbl" style="left:${X(1) - 60}px;top:${Y(0) + 34}px;opacity:${a};background:var(--cy);color:var(--bg)">paths(0, 1)</div><div class="lbl" style="left:${X(0) + 34}px;top:${Y(1) - 4}px;opacity:${a};background:var(--pk);color:var(--bg)">paths(1, 0)</div>`; }
  if (sc === 'rule' && li === 1) lab += `<div class="lbl" style="left:${X(GC) - 40}px;top:${Y(GR) - 120}px;transform:scale(${RT.pop(t, l.start + 0.3)});background:var(--ok);color:var(--bg);font-size:40px">+1</div>`;
  if (sc === 'rule' && li === 2) lab += `<div class="lbl" style="left:${GX + C * CELL + 26}px;top:${Y(0) + 46}px;opacity:${RT.p(t, l.start + 0.3, l.start + 0.6)};color:var(--bad);font-size:40px">0</div>`;
  if (st && st.kind === 'found') lab += `<div class="lbl" style="left:${X(GC) - 40}px;top:${Y(GR) - 120}px;transform:scale(${RT.pop(t, st.t0)});background:var(--ok);color:var(--bg);font-size:40px">+1</div>`;
  // numbers in the trick
  if (sc === 'trick' && li === 0) for (const f of FILL) if (t >= f.t) lab += `<div class="num" style="left:${X(f.c) - 110}px;top:${Y(f.r) - 68}px;transform:scale(${RT.pop(t, f.t)})">${f.v}${f.sum ? `<small>${f.sum}</small>` : ''}</div>`;
  $('nums').innerHTML = lab;
  // robot
  const ro = $('robot'); const hideR = inBig || inCta;
  const rop = sc === 'trick' ? 0 : 1;
  ro.style.opacity = hideR ? 0 : rop; ro.style.left = rb.x + 'px'; ro.style.top = rb.y + 'px';
  const bob = sc === 'hook' ? Math.sin(t * 6) * 6 : 0;
  ro.style.transform = `translateY(${bob}px) scale(${rb.s})`;
  // title row: current call + counter
  $('gtitle').style.opacity = inBig || inCta ? 0 : 1;
  let call = 'paths(0, 0)', cc = 'var(--ink)';
  if (st) { const [r, c] = st.kind === 'off' ? st.call : st.to;
    call = st.kind === 'off' ? `paths(${r}, ${c}) → 0` : st.kind === 'found' ? `paths(${r}, ${c}) → 1` : st.kind === 'back' ? `back to paths(${r}, ${c})` : `paths(${r}, ${c})`;
    cc = st.kind === 'off' ? 'var(--bad)' : st.kind === 'found' ? 'var(--ok)' : 'var(--ink)'; }
  if (sc === 'trick') call = 'paths(0, 0) = 3';
  $('call').textContent = call; $('call').style.color = cc;
  const found = sc === 'hook' || sc === 'rule' ? '?' : sc === 'trace' ? STEPS.filter(s => s.kind === 'found' && t >= s.t0).length : 3;
  $('cn').textContent = found;
  const lastF = STEPS.filter(s => s.kind === 'found' && t >= s.t0).pop();
  $('cn').style.transform = lastF && sc === 'trace' ? `scale(${RT.pop(t, lastF.t0, 0.3) * (t - lastF.t0 < 0.3 ? 1.25 : 1)})` : 'none';
  // code highlight
  let on = [];
  if (sc === 'rule') on = [[6], [4, 5], [2, 3]][li];
  if (sc === 'trace') on = !st ? [6] : st.kind === 'off' ? [2, 3] : st.kind === 'found' ? [4, 5] : [1, 6];
  if (sc === 'trick') on = [6];
  [...$('code').children].forEach((d, i) => d.classList.toggle('on', on.includes(i + 1)));
  $('memo').style.opacity = sc === 'trick' && li === 2 ? RT.p(t, l.start, l.start + 0.3) : 0;
  // big grid (10 x 10)
  $('big').style.opacity = inBig ? RT.p(t, RT.L('trick', 1).start - 0.05, RT.L('trick', 1).start + 0.25) : 0;
  if (inBig) {
    const k1 = RT.L('trick', 1), k2 = RT.L('trick', 2);
    if (li === 1) { const p = RT.ease(RT.p(t, k1.start + 0.3, k1.start + 1.6));
      $('bk').textContent = '10 × 10 grid'; $('bn').textContent = Math.round(48620 * p).toLocaleString('en-US'); $('bn').style.color = 'var(--hi)'; $('bu').textContent = 'paths';
      [...$('mini').children].forEach(e => e.classList.remove('on')); }
    else { const p = RT.p(t, k2.start + 0.2, k2.end - 0.3), n = Math.round(100 * p);
      $('bk').textContent = 'with saved answers'; $('bn').textContent = n; $('bn').style.color = 'var(--ok)'; $('bu').textContent = 'steps ⚡';
      const ord = [...Array(100).keys()].sort((a, b) => ((9 - a % 10) + (9 - (a / 10 | 0))) - ((9 - b % 10) + (9 - (b / 10 | 0))) || a - b);
      [...$('mini').children].forEach(e => e.classList.remove('on')); ord.slice(0, n).forEach(i => $('mini').children[i].classList.add('on')); }
  }
  $('cta').style.opacity = inCta ? RT.p(t, RT.S('cta').start, RT.S('cta').start + 0.3) : 0;
  if (inCta) $('cta').firstElementChild.style.transform = `scale(${RT.pop(t, RT.S('cta').start + 0.1, 0.35)})`;
};
</script></body></html>
